    purpose: Former SERP measurement source, replaced by Semrush.
    status: retired
    login_identity: UNKNOWN - not established from this repository
    secret_ref: NONE_CONFIGURED
    credential_location: apps/sites/.env.local, variable names BRIGHTDATA_API_KEY / BRIGHTDATA_ZONE
    verified_by: returns zone_not_found since 2026-09-01; still reachable behind `--source brightdata` in scripts/keyword-sweep.ts
  google_indexing_api:
    id: google_indexing_api
