    status: active
    login_identity: benasjad-hub
    secret_ref: NONE_CONFIGURED
    remote: https://github.com/benasjad-hub/iptv-network.git
    verified_by: git remote -v and git rev-parse on 2026-09-09, HEAD 7774f723 on branch main
  github_brain:
    id: github_brain
    purpose: Private repository holding this Project Brain
    status: unknown
    login_identity: UNKNOWN - no remote has been added to this repository yet
    secret_ref: NONE_CONFIGURED
    verified_by: git remote -v in this repository returns nothing on 2026-09-09
  supabase_iptv_network:
    id: supabase_iptv_network
    purpose: >-
      The network's own Postgres. Holds the `sites` table (the canonical site
      list), keywords, prices and niches. Prices in this table OVERRIDE the
      values written in code.
    status: active
    login_identity: project ref xqgrfntyhizrdomxqgxv, organisation "website iptv center"
    secret_ref: NONE_CONFIGURED
    credential_location: apps/sites/.env.local, variable names NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY
    verified_by: read queries on 2026-09-09 returned 78 rows, 35 live and 43 draft
    warning: >-
      A SECOND Supabase project, ref stefvhralisxnhhdhkvj, belongs to a
      DIFFERENT production application and is FORBIDDEN to this project,
      read-only calls included. See the owner decision on repository boundaries.

  # ── hosting: four distinct paths, and they do NOT deploy the same way ─────
  vercel:
    id: vercel
    purpose: Hosts 41 of the 78 sites. Deploys automatically on every push to main.
    status: active
    login_identity: UNKNOWN - not established from this repository
    secret_ref: NONE_CONFIGURED
    credential_location: apps/sites/.env.local, variable name VERCEL_TOKEN
    verified_by: data/network-audit.json 2026-09-09, field `hosting` = vercel on 41 of 78 sites
  cloudflare_workers:
    id: cloudflare_workers
    purpose: >-
      Hosts 31 sites - 24 on a dedicated worker each, 7 sharing one cluster.
      Also provides the image generation and the screenshot API used for visual
      checks.
    status: active
    login_identity: UNKNOWN - not established from this repository
    secret_ref: NONE_CONFIGURED
    credential_location: >-
      apps/sites/.env.local, variable names CLOUDFLARE_ACCOUNT_ID /
      CLOUDFLARE_API_TOKEN / CLOUDFLARE_EMAIL / CLOUDFLARE_GLOBAL_KEY
    verified_by: data/network-audit.json 2026-09-09, `hosting` = cloudflare-worker on 24 and cloudflare-shared on 7
    warning: >-
      These sites do NOT deploy on push. scripts/cron-deploy-cf.sh must run
      (crontab: 15 */2). Without it, newly written articles return 404 on every
      Cloudflare-hosted site until someone deploys by hand.
  vps_next_start:
    id: vps_next_start
    purpose: Hosts 6 sites served by `next start` on port 2052 of this machine.
    status: active
    login_identity: local process on srv1731217, supervisor UNKNOWN from this account
    secret_ref: NONE_CONFIGURED
    verified_by: >-
      data/network-audit.json 2026-09-09 shows `hosting` = vps:2052 on 6 sites;
      port 2052 confirmed LISTEN by ss; `next start` processes confirmed by ps.
      The supervising unit could not be read - pm2 runs as root and this account
      cannot list it.
    warning: >-
      These sites do NOT deploy on push either. scripts/cron-deploy-vps.sh must
      run (crontab: 45 */2), and each rebuild takes the sites down for roughly
      15 minutes.

  # ── measurement and indexing ─────────────────────────────────────────────
  google_search_console:
    id: google_search_console
    purpose: >-
      Position, impression and indexation data for all 78 sites, split across
      SEVEN separate accounts, A through G.
    status: active
    login_identity: 7 accounts, keyed A-G in data/gsc-accounts.json
    secret_ref: NONE_CONFIGURED
    credential_location: >-
      secrets/gsc-service-account.json, -2, -3, gsc-yannick, gsc-hebert,
      gsc-teacher, gsc-kora; and apps/sites/.env.local variable names
      GSC_SERVICE_ACCOUNT_KEY / _B / _C
    verified_by: data/gsc-accounts.json on 2026-09-09 lists 7 accounts and maps all 78 sites
    warning: >-
      Every call must use the CALLING SITE's own account key. A shared key
      returns 403 on the others, and the failure is silent unless the caller
      looks for it.
  semrush_api_v4:
    id: semrush_api_v4
    purpose: >-
      SERP and keyword-volume measurement. The competition source for choosing
      an article's target query.
    status: active
    login_identity: trial key supplied by the owner, rotated periodically
    secret_ref: NONE_CONFIGURED
    credential_location: apps/sites/.env.local, variable name SEMRUSH_V4_KEY
    verified_by: live calls on 2026-09-09 returned CSV reports through scripts/lib/semrush-mcp.ts
    warning: >-
      Endpoint v2, header `Apikey`, never `Bearer`. Errors arrive as HTTP 200
      with the message in the body. The remaining unit balance is NOT readable
      for this key format, so the client counts its own calls. The key's expiry
      date is UNKNOWN.
  bright_data:
