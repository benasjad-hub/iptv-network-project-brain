# SERVICES — IPTV Network
#
# Metadata only. A secret_ref is a LABEL under which a value would resolve in a
# vault; NO VAULT IS CHOSEN OR PROVISIONED, so every one reads NONE_CONFIGURED.
# No value may ever appear here - SECRETS_POLICY.md.
#
# `credential_location` names the FILE and the VARIABLE NAME under which a
# credential is read today. It is a pointer, never a value, and it is not a
# secret_ref: nothing resolves it automatically.
#
# EVERY entry below was verified on 2026-09-09 against the working tree at
# benasjad-hub/iptv-network commit 7774f723, the Supabase `sites` table, the
# generated audit data/network-audit.json (2026-09-09T06:41:16Z), and the
# host's own listening sockets. The verification method is stated per entry.

reviewed_against: "602b580"

vault:
  configured: false
  provisioned: false
  product: UNKNOWN - no vault has been chosen. Naming a product would prove nothing.
  secret_ref_scheme: UNKNOWN

# status: active | active_external | unverified_from_this_repo | unknown | retired
services:

