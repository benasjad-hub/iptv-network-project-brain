note: >-
  Nothing is PACKAGED or RELEASED for this project: there is no binary, no image
  and no published package. The network's build outputs are deployment artefacts
  rather than releases - a Vercel build per push, a shared open-next bundle for
  the Cloudflare workers, and a Next.js build served by `next start` on the VPS.
  None of them is versioned, retained or rolled back as an artifact, so none is
  registered here. Recording a deployment as an artifact would imply a
  retrievable version that does not exist.
